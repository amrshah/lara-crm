name: Rebrand Krayin to AlamiaConnect

on:
  workflow_dispatch:  # Manual trigger only - run once after forking

jobs:
  rebrand:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Create rebranding branch
        run: |
          git checkout -b rebranding-automated
          
      - name: Rebrand text content
        run: |
          # Function to replace text in files
          replace_text() {
            find . -type f \
              -not -path "*/\.*" \
              -not -path "*/node_modules/*" \
              -not -path "*/vendor/*" \
              -not -path "*/storage/*" \
              -not -path "*/bootstrap/cache/*" \
              -not -name "*.png" \
              -not -name "*.jpg" \
              -not -name "*.jpeg" \
              -not -name "*.gif" \
              -not -name "*.ico" \
              -not -name "*.svg" \
              -not -name "*.pdf" \
              -exec sed -i "s/$1/$2/g" {} +
          }
          
          # Replace brand names
          replace_text "Krayin CRM" "AlamiaConnect CRM"
          replace_text "Krayin" "AlamiaConnect"
          replace_text "krayin-crm" "alamiaconnect-crm"
          replace_text "krayin" "alamiaconnect"
          replace_text "KRAYIN" "ALAMIACONNECT"
          
          # Replace URLs and domains
          replace_text "krayincrm\.com" "amrshah.github.io"
          replace_text "krayin\.com" "amrshah.github.io"
          
          # Replace email
          replace_text "admin@example\.com" "amr.shah@gmail.com"
          
          echo "Text rebranding completed"
          
      - name: Update composer.json
        run: |
          if [ -f "composer.json" ]; then
            sed -i 's/"name": "krayin\/laravel-crm"/"name": "alamiasoft\/alamiaconnect-crm"/g' composer.json
            sed -i 's/"description": ".*"/"description": "AlamiaConnect CRM - Customer Relationship Management System"/g' composer.json
            echo "composer.json updated"
          fi
          
      - name: Update package.json
        run: |
          if [ -f "package.json" ]; then
            sed -i 's/"name": ".*"/"name": "alamiaconnect-crm"/g' package.json
            sed -i 's/"description": ".*"/"description": "AlamiaConnect CRM"/g' package.json
            echo "package.json updated"
          fi
          
      - name: Standardize image filenames and update references
        run: |
          # Function to rename image files and update all references
          rename_and_update() {
            local old_pattern="$1"
            local new_name="$2"
            
            # Find the first matching image file
            local old_file=$(find . -type f -iname "$old_pattern" | head -1)
            
            if [ -n "$old_file" ]; then
              local old_basename=$(basename "$old_file")
              local old_dir=$(dirname "$old_file")
              
              # Rename the file
              mv "$old_file" "$old_dir/$new_name"
              echo "Renamed: $old_file -> $old_dir/$new_name"
              
              # Update all references in code
              find . -type f \
                -not -path "*/\.*" \
                -not -path "*/node_modules/*" \
                -not -path "*/vendor/*" \
                -not -path "*/storage/*" \
                -not -name "*.png" \
                -not -name "*.jpg" \
                -not -name "*.jpeg" \
                -not -name "*.gif" \
                -not -name "*.ico" \
                -not -name "*.svg" \
                -exec sed -i "s|$old_basename|$new_name|g" {} +
              
              echo "Updated all references from $old_basename to $new_name"
            fi
          }
          
          # Standardize common image files
          rename_and_update "*logo*.png" "logo.png"
          rename_and_update "*logo*.svg" "logo.svg"
          rename_and_update "*logo*dark*.png" "logo-dark.png"
          rename_and_update "*logo*dark*.svg" "logo-dark.svg"
          rename_and_update "*favicon*.ico" "favicon.ico"
          rename_and_update "*icon*.png" "icon.png"
          
          echo "Image file standardization completed"
          
