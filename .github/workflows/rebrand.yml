          EOF
                    
                    # Create docs directory if it doesn't exist
                    mkdir -p docs
                    mv docs/ATTRIBUTION.md docs/ATTRIBUTION.md 2>/dev/null || true
          
          echo "ATTRIBUTION.md created"
          
      - name: Update README.md
        run: |
          # Add attribution section to README
          if [ -f "README.md" ]; then
            # Create temporary file with new content
            cat > README_TEMP.md << 'EOF'
          # AlamiaConnect CRM

          A comprehensive Customer Relationship Management system built by AlamiaSoft.

          ## Built on Krayin CRM

          AlamiaConnect CRM is built upon [Krayin CRM](https://github.com/krayin/laravel-crm),
          an open-source CRM framework licensed under the MIT License. We extend our gratitude
          to the Krayin team for their excellent work.

          See [ATTRIBUTION.md](docs/ATTRIBUTION.md) for complete attribution details.

          ---

          EOF
            
            # Append existing README content (skip first line if it's a title)
            tail -n +2 README.md >> README_TEMP.md
            
            # Replace README
            mv README_TEMP.md README.md
            
            echo "README.md updated with attribution"
          fi
          
      - name: Update .env.example
        run: |
          if [ -f ".env.example" ]; then
            sed -i 's/APP_NAME=.*/APP_NAME="AlamiaConnect CRM"/g' .env.example
            sed -i 's/APP_URL=.*/APP_URL=https:\/\/amrshah.github.io/g' .env.example
            echo ".env.example updated"
          fi
          
      - name: Commit all changes
        run: |
          git add .
          git commit -m "Automated rebranding: Krayin → AlamiaConnect
          
          - Rebranded all text references
          - Updated composer.json and package.json
          - Standardized image filenames (logo.png, favicon.ico, etc.)
          - Created NOTICE.third-party.txt with Krayin MIT attribution
          - Created proprietary LICENSE (EULA)
          - Created ATTRIBUTION.md documentation
          - Updated README.md with attribution
          - Updated configuration files
          
          Note: Replace image files (logo.png, favicon.ico, etc.) manually"
          
      - name: Push rebranding branch
        run: |
          git push origin rebranding-automated
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: rebranding-automated
          title: "🎨 Automated Rebranding: Krayin → AlamiaConnect"
          body: |
            ## Automated Rebranding Complete ✅
            
            This PR contains all automated rebranding changes from Krayin to AlamiaConnect.
            
            ### Changes Included:
            - ✅ All text references updated (Krayin → AlamiaConnect)
            - ✅ composer.json and package.json updated
            - ✅ Image files standardized (logo.png, favicon.ico, etc.)
            - ✅ NOTICE.third-party.txt created (Krayin MIT attribution)
            - ✅ LICENSE (EULA) created
            - ✅ ATTRIBUTION.md created
            - ✅ README.md updated with attribution
            - ✅ Configuration files updated
            
            ### Manual Steps Required:
            1. ⚠️ **Replace image files** with your custom designs:
               - `logo.png` or `logo.svg`
               - `logo-dark.png` or `logo-dark.svg` (if exists)
               - `favicon.ico`
               - `icon.png`
            2. Review all changes carefully
            3. Test the application
            4. Merge this PR
            
            ### Image Files to Replace:
            Look for these standardized filenames in the codebase and replace with your designs.
            All code references have been updated to use these standard names.
            
            ---
            
            **Generated by**: AlamiaConnect Rebranding Workflow
            **Contact**: amr.shah@gmail.com
          labels: automated, rebranding