name: Sync with Krayin Upstream

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9:00 AM UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  sync_upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Add Krayin upstream remote
        run: |
          git remote add upstream https://github.com/krayin/laravel-crm.git
          git fetch upstream

      - name: Check for new commits
        id: check_commits
        run: |
          # Get the current upstream head
          UPSTREAM_HEAD=$(git rev-parse upstream/master)
          
          # Check if we have this commit in our history
          if git merge-base --is-ancestor $UPSTREAM_HEAD HEAD; then
            echo "Already up to date with upstream."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "New commits found in upstream."
            echo "has_changes=true" >> $GITHUB_OUTPUT

            # Count commits behind
            COMMIT_COUNT=$(git rev-list HEAD..upstream/master --count)
            echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Create Sync Branch and PR
        if: steps.check_commits.outputs.has_changes == 'true'
        run: |
          BRANCH_NAME="upstream-sync-$(date +%Y%m%d)"
          git checkout -b $BRANCH_NAME
          
          # Attempt to merge upstream/master
          # We use --no-commit to allow us to check for conflicts if needed,
          # but here we want to commit if successful or fail if conflict.
          # Better approach for automation: try merge, if conflict, fail step but create PR anyway?
          # Ideally we want a PR that merges upstream into our codebase.
          
          git merge upstream/master --no-edit || {
            echo "Merge conflict detected. Aborting merge."
            git merge --abort
            CONFLICT=true
          }

          if [ "$CONFLICT" == "true" ]; then
             echo "Merge conflict prevented automatic merge. Creating a PR with upstream reference to facilitate manual merge."

             # Create a branch pointing to upstream/master
             CONFLICT_BRANCH="upstream-conflict-$(date +%Y%m%d)"
             git checkout -b $CONFLICT_BRANCH upstream/master
             git push origin $CONFLICT_BRANCH

             gh pr create \
              --title "⚠️ Sync Conflict: Manual Merge Required" \
              --body "This PR points to the upstream Krayin CRM master branch. An automatic merge attempt failed due to conflicts. Please merge this branch manually into main." \
              --base main \
              --head $CONFLICT_BRANCH \
              --label "upstream-sync-conflict"

             exit 0
          fi
          
          git push origin $BRANCH_NAME

          gh pr create \
            --title "⬆️ Sync with Krayin Upstream" \
            --body "This PR merges changes from the upstream Krayin CRM repository. Please review and run tests before merging. breaking changes may be present." \
            --base main \
            --head $BRANCH_NAME \
            --label "upstream-sync"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
